<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>申请成为骑手</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:"微软雅黑";background:#f5f7fa}
        .nav{background:#409eff;padding:15px 30px;color:white}
        .nav a{color:white;text-decoration:none;margin-right:20px}
        .box{max-width:500px;margin:50px auto;background:white;padding:30px;border-radius:8px;box-shadow:0 0 10px #eee}
        .box h2{text-align:center;margin-bottom:20px}
        .item{margin-bottom:15px}
        label{display:block;margin-bottom:5px}
        input{width:100%;height:40px;padding:0 10px;border:1px solid #ddd;border-radius:4px}
        
        input[readonly]{
            background:#f5f5f5;
            color:#666;
            cursor:not-allowed;
        }
        .disabled-btn {
            background: #ccc !important;
            cursor: not-allowed !important;
        }
        .tip {
            text-align:center;
            margin-top:15px;
            font-size:14px;
            color:#666;
            display:block;
        }
    </style>
</head>
<body>

<div class="nav">
    <a href="index.html">首页</a>
    <a href="apply-rider.html">申请骑手</a>
</div>

<div class="box">
    <h2>骑手认证申请</h2>

    <div class="item">
        <label>真实姓名（自动获取，不可修改）</label>
        <input type="text" id="realName" readonly>
    </div>

    <div class="item">
        <label>联系电话</label>
        <input type="text" id="phone" placeholder="请输入手机号">
    </div>

    <div class="item">
        <label>身份证号码</label>
        <input type="text" id="idCard" placeholder="请输入身份证号">
    </div>

    <div class="item">
        <label>常住地址</label>
        <input type="text" id="address" placeholder="请输入常住地址">
    </div>

    <button id="submitBtn" class="btn" onclick="submitApply()" style="width:100%;height:42px;background:#409eff;color:white;border:none;border-radius:4px;font-size:16px;cursor:pointer;margin-top:10px">提交认证申请</button>
    
    <div id="tipText" class="tip"></div>
</div>

<script>
const baseUrl = "http://172.25.168.86:9090";

window.onload = function () {
    let userStr = localStorage.getItem("userInfo");
    if (!userStr) {
        alert("请先登录！");
        location.href = "login.html";
        return;
    }

    let user = JSON.parse(userStr);
    document.getElementById("realName").value = user.username;

    checkUserHasApplied(user.id);
}

function checkUserHasApplied(userId) {
    fetch(`${baseUrl}/api/certification/list?pageNum=1&pageSize=100`)
        .then(res => res.json())
        .then(res => {
            let list = res.data?.records || [];
            let myApps = list.filter(item => item.userId == userId);

            if (myApps.length === 0) return;

            let last = myApps[0];
            let status = last.status;
            let btn = document.getElementById("submitBtn");
            let inputs = document.querySelectorAll("#phone, #idCard, #address");
            let tipText = document.getElementById("tipText");

            // 所有状态都禁用提交按钮和输入框
            btn.disabled = true;
            btn.classList.add("disabled-btn");
            inputs.forEach(inp => inp.readOnly = true);

            if (status === "待审核") {
                btn.innerText = "申请审核中";
                tipText.innerText = "您的申请正在审核中，无法再次提交";
                tipText.style.color = "#ff9800";
            }
            else if (status === "通过") {
                btn.innerText = "✅ 您已成为骑手";
                tipText.innerText = "您已通过认证，无需重复申请";
                tipText.style.color = "#28a745";
            }
            else if (status === "拒绝") {
                btn.innerText = "❌ 申请已驳回";
                tipText.innerText = "驳回原因：" + (last.reason || "未填写");
                tipText.style.color = "#ff4444";
            }
        })
}

function submitApply() {
    let realName = document.getElementById("realName").value.trim();
    let phone = document.getElementById("phone").value.trim();
    let idCard = document.getElementById("idCard").value.trim();
    let address = document.getElementById("address").value.trim();
    let user = JSON.parse(localStorage.getItem("userInfo"));

    if (!realName || !phone || !idCard || !address) {
        alert("请填写完整信息！");
        return;
    }

    fetch(baseUrl + "/api/certification", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            userId: user.id,
            realName: realName,
            contact: phone,
            idCard: idCard,
            address: address,
            status: "待审核"
        })
    })
    .then(res => res.json())
    .then(res => {
        alert("提交成功！等待管理员审核");
        location.href = "index.html";
    })
}
</script>
</body>
</html>
