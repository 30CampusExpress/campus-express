<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>校园快递跑腿系统-全部订单</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <!-- 导航栏 -->
    <div class="nav">
        <a href="index.html">首页</a>
        <a href="login.html">登录</a>
        <a href="publish.html">发布跑腿</a>
        <a href="mine.html">个人中心</a>
    </div>

    <!-- 订单列表容器 -->
    <div class="order-container">
        <h2 class="title">校园跑腿全部订单</h2>

        <!-- 订单卡片1 -->
        <div class="order-card">
            <div class="order-item">
                <span class="order-label">类型：</span>
                <span class="order-value">快递代取</span>
            </div>
            <div class="order-item">
                <span class="order-label">取件/送达：</span>
                <span class="order-value">南门快递站 | 3栋宿舍</span>
            </div>
            <div class="order-item">
                <span class="order-label">赏金：</span>
                <span class="order-value">5元</span>
            </div>
            <div class="order-item">
                <span class="order-label">状态：</span>
                <span class="order-value status-pending">待接单</span>
            </div>
            <button class="order-btn">立即接单</button>
        </div>

        <!-- 订单卡片2 -->
        <div class="order-card">
            <div class="order-item">
                <span class="order-label">类型：</span>
                <span class="order-value">校园跑腿</span>
            </div>
            <div class="order-item">
                <span class="order-label">取件/送达：</span>
                <span class="order-value">食堂 | 教学楼</span>
            </div>
            <div class="order-item">
                <span class="order-label">赏金：</span>
                <span class="order-value">4元</span>
            </div>
            <div class="order-item">
                <span class="order-label">状态：</span>
                <span class="order-value status-pending">待接单</span>
            </div>
            <button class="order-btn">立即接单</button>
        </div>

        <!-- 订单卡片3 -->
        <div class="order-card">
            <div class="order-item">
                <span class="order-label">类型：</span>
                <span class="order-value">快递代寄</span>
            </div>
            <div class="order-item">
                <span class="order-label">取件/送达：</span>
                <span class="order-value">8栋宿舍 | 北门快递点</span>
            </div>
            <div class="order-item">
                <span class="order-label">赏金：</span>
                <span class="order-value">6元</span>
            </div>
            <div class="order-item">
                <span class="order-label">状态：</span>
                <span class="order-value status-done">已接单</span>
            </div>
            <button class="order-btn" disabled>已被接单</button>
        </div>
    </div>

    <!-- 页脚 -->
    <div class="footer">© 2026 校园快递跑腿管理系统</div>
</body>
</html>
