<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>校园快递跑腿系统-注册</title>
    <link rel="stylesheet" href="./style.css">
    <style>
        .loading-spinner {
            width: 16px;
            height: 16px;
            border: 2px solid #fff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            display: none;
            margin-right: 6px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .login-btn:disabled {
            background-color: #b3c4d8 !important;
            cursor: not-allowed;
        }
        .user-info {
            color: white;
            margin-left: 20px;
            display: none;
        }
        .user-info button {
            margin-left: 8px;
            padding: 2px 6px;
            cursor: pointer;
        }
        .tip-text{
            color:red;
            font-size:12px;
            margin-top:5px;
            display:none;
            text-align:right;
        }
        select {
            width:100%;
            height:42px;
            padding:0 10px;
            border:1px solid #ddd;
            border-radius:4px;
            font-size:14px;
            background:white;
        }
        /* 核心：表单改为 label + input 同一行对齐 */
        .login-card {
            max-width: 450px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px #eee;
        }
        .login-card h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }
        .form-item {
            display: flex;
            align-items: center;
            margin-bottom: 18px;
            gap: 10px;
        }
        .form-item label {
            flex: 0 0 70px; /* 固定标签宽度，保证对齐 */
            color: #666;
            font-size: 14px;
            text-align: right;
            white-space: nowrap;
        }
        .form-item .input-wrap {
            flex: 1;
        }
        .form-item input,
        .form-item select {
            width: 100%;
            height: 42px;
            padding: 0 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }
        .login-btn {
            width: 100%;
            height: 42px;
            background: #409eff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 10px;
        }
        .register-tip {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }
        .register-tip a {
            color: #409eff;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="nav">
        <a href="index.html">首页</a>
        <a href="login.html" id="navLogin">登录</a>
        <a href="register.html">注册</a>

        <span id="userInfo" class="user-info">
            欢迎，<span id="uname"></span>
            <button onclick="logout()">退出</button>
        </span>
    </div>

    <div class="login-card">
        <h2>用户注册</h2>
        
        <form class="login-form" id="registerForm" autocomplete="off">
            <div class="form-item">
                <label>学号：</label>
                <div class="input-wrap">
                    <input type="text" id="studentId" placeholder="请输入学号" autocomplete="off">
                    <div class="tip-text" id="nameTip">该学号已被注册！</div>
                </div>
            </div>
            <div class="form-item">
                <label>姓名：</label>
                <div class="input-wrap">
                    <input type="text" id="realName" placeholder="请输入姓名" autocomplete="off">
                </div>
            </div>
            <div class="form-item">
                <label>性别：</label>
                <div class="input-wrap">
                    <select id="gender">
                        <option value="0">未知</option>
                        <option value="1">男</option>
                        <option value="2">女</option>
                    </select>
                </div>
            </div>
            <div class="form-item">
                <label>手机号：</label>
                <div class="input-wrap">
                    <input type="text" id="phone" placeholder="请输入手机号" autocomplete="off">
                </div>
            </div>
            <div class="form-item">
                <label>密码：</label>
                <div class="input-wrap">
                    <input type="password" id="password" placeholder="请输入密码" autocomplete="new-password">
                </div>
            </div>

            <button type="submit" class="login-btn" id="regBtn">
                <span class="loading-spinner"></span>
                <span class="btn-text">注册</span>
            </button>
        </form>

        <p class="register-tip">已有账号？<a href="login.html">去登录</a></p>
    </div>

    <div class="footer">© 2026 校园快递跑腿管理系统</div>

<script>
    const baseUrl = "http://172.25.168.86:9090";
    const regBtn = document.getElementById("regBtn");
    const spinner = document.querySelector(".loading-spinner");
    const btnText = document.querySelector(".btn-text");

    document.getElementById("studentId").addEventListener("blur", function(){
        let username = this.value.trim();
        if(!username) return;
        
        fetch(baseUrl + "/api/user/check?username=" + username)
        .then(res=>res.json())
        .then(res=>{
            if(res.data === true){
                document.getElementById("nameTip").style.display = "block";
            }else{
                document.getElementById("nameTip").style.display = "none";
            }
        })
    });

    document.getElementById("registerForm").addEventListener("submit", function (e) {
        e.preventDefault();

        let studentId = document.getElementById("studentId").value.trim();
        let realName = document.getElementById("realName").value.trim();
        let gender = parseInt(document.getElementById("gender").value);
        let phone = document.getElementById("phone").value.trim();
        let password = document.getElementById("password").value.trim();

        if(document.getElementById("nameTip").style.display === "block"){
            alert("注册失败：当前学号已经存在，请勿重复注册");
            return;
        }
        if (!studentId) { alert("注册失败：请填写学号"); return; }
        if (!realName) { alert("注册失败：请填写真实姓名"); return; }
        if (!phone) { alert("注册失败：请填写手机号码"); return; }
        if (!password) { alert("注册失败：请设置登录密码"); return; }
        if(password.length < 6){ alert("注册失败：密码长度不能少于6位"); return; }

        regBtn.disabled = true;
        spinner.style.display = "inline-block";
        btnText.innerText = "注册中...";

        fetch(baseUrl + "/api/user/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                username: studentId,
                nickname: realName,
                gender: gender,
                phone: phone,
                password: password
            })
        })
        .then(res => res.json())
        .then(res => {
            if (res.code === 200) {
                alert("注册成功！请前往登录页面登录账号");
                location.href = "login.html";
            } else {
                let errMsg = res.msg || res.message || "未知原因导致注册失败，请稍后重试";
                alert("注册失败：" + errMsg);
            }
        })
        .catch(() => {
            alert("注册失败：无法连接后端服务器，请检查网络或服务是否启动");
        })
        .finally(() => {
            regBtn.disabled = false;
            spinner.style.display = "none";
            btnText.innerText = "注册";
        });
    });

    window.onload = function () {
        let navLogin = document.getElementById("navLogin");
        let userInfo = document.getElementById("userInfo");
        let uname = document.getElementById("uname");

        let isLogin = localStorage.getItem("isLogin");
        let username = localStorage.getItem("username");

        if (isLogin == "true") {
            navLogin.style.display = "none";
            userInfo.style.display = "inline-block";
            uname.innerText = username;
        } else {
            navLogin.style.display = "inline-block";
            userInfo.style.display = "none";
        }
    }

    function logout() {
        localStorage.clear();
        alert("退出成功");
        location.href = "login.html";
    }
</script>
</body>
</html>
