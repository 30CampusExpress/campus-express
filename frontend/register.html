<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>校园快递跑腿系统-注册</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="nav">
        <a href="index.html">首页</a>
        <a href="login.html">登录</a>
        <a href="register.html">注册</a>
    </div>

    <div class="login-card">
        <h2>用户注册</h2>
        <form class="login-form">
            <div class="form-item">
                <label>学号：</label>
                <input type="text" placeholder="请输入学号">
            </div>
            <div class="form-item">
                <label>姓名：</label>
                <input type="text" placeholder="请输入姓名">
            </div>
            <div class="form-item">
                <label style="width:70px; white-space: nowrap;">手机号：</label>
                <input type="text" placeholder="请输入手机号">
            </div>
            <div class="form-item">
                <label>密码：</label>
                <input type="password" placeholder="请输入密码">
            </div>
            <button type="submit" class="login-btn">注册</button>
        </form>
        <p class="register-tip">已有账号？<a href="login.html">去登录</a></p>
    </div>

    <div class="footer">© 2026 校园快递跑腿管理系统</div>
</body>
</html>
