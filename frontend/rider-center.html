<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>骑手中心 - 接单</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "微软雅黑"; background: #f5f7fa; }
        .nav { background: #409eff; padding: 15px 30px; color: white; display: flex; justify-content: space-between; align-items: center; }
        .nav a { color: white; text-decoration: none; }

        .box {
            max-width: 800px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px #eee;
        }
        .box h2 {
            text-align: center;
            margin-bottom: 10px;
            color: #333;
        }
        .info {
            text-align: center;
            margin-bottom: 30px;
            color: #666;
        }

        .order-card {
            background: #f8f9fa;
            border-left: 5px solid #409eff;
            padding: 18px;
            margin-bottom: 12px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }
        .order-card .info-left {
            flex: 1;
        }
        .order-card h4 {
            margin-bottom: 6px;
            font-size: 16px;
        }
        .order-card p {
            color: #666;
            font-size: 14px;
            margin: 3px 0;
        }
        .order-card .tip {
            color: #ff4d4f;
            font-weight: bold;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        .btn-take {
            padding: 10px 18px;
            background: #409eff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-take:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .btn-detail {
            padding: 10px 18px;
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-finish {
            padding: 10px 18px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-finish:disabled {
            background: #ccc !important;
            cursor: not-allowed !important;
        }

        .tab {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab button {
            padding: 10px 20px;
            border: none;
            background: #eee;
            cursor: pointer;
            border-radius: 5px;
            font-size: 14px;
        }
        .tab button.active {
            background: #409eff;
            color: white;
        }
        .tab-content {
            display: none;
        }
        .tab-content.show {
            display: block;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
        }
        .modal-content h3 {
            margin-bottom: 20px;
            color: #333;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }
        .modal-content p {
            margin: 10px 0;
            font-size: 14px;
            color: #666;
        }
        .modal-content p strong {
            color: #333;
            width: 100px;
            display: inline-block;
        }
        .modal-close {
            margin-top: 20px;
            padding: 8px 16px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="nav">
    <a href="index.html">← 返回首页</a>
    <span>骑手接单中心</span>
</div>

<div class="box">
    <h2>✅ 骑手接单大厅</h2>
    <div class="info">认证已通过，可正常接单</div>

    <div class="tab">
        <button class="tab-btn active" onclick="switchTab(0)">待接订单</button>
        <button class="tab-btn" onclick="switchTab(1)">我的接单记录</button>
    </div>

    <div id="tab1" class="tab-content show">
        <div id="orderList"></div>
    </div>

    <div id="tab2" class="tab-content">
        <div id="myOrderList"></div>
    </div>
</div>

<div id="orderModal" class="modal">
    <div class="modal-content">
        <h3>订单详情</h3>
        <div id="modalBody"></div>
        <button class="modal-close" onclick="closeModal()">关闭</button>
    </div>
</div>

<script>
const baseUrl = "http://172.25.168.86:9090";
let user = JSON.parse(localStorage.getItem("userInfo"));
let takenOrderIds = new Set();

window.onload = function () {
    if (!user) {
        alert("请先登录！");
        location.href = "login.html";
        return;
    }
    loadAllOrders();
    loadMyTakeOrders();
};

// 切换标签
function switchTab(index) {
    document.querySelectorAll(".tab-content").forEach((el) => el.classList.remove("show"));
    document.querySelectorAll(".tab-btn").forEach((el) => el.classList.remove("active"));
    document.querySelectorAll(".tab-content")[index].classList.add("show");
    document.querySelectorAll(".tab-btn")[index].classList.add("active");
}

// 加载所有订单
function loadAllOrders() {
    fetch(baseUrl + "/api/order/list?pageNum=1&pageSize=100")
        .then(res => res.json())
        .then(res => {
            let list = res.data?.records || [];
            let waitList = list.filter(o => !takenOrderIds.has(o.id));
            renderWaitOrders(waitList);
        });
}

// 渲染待接单
function renderWaitOrders(list) {
    let html = "";
    list.forEach(o => {
        let status = o.state || o.status || "未知状态";
        html += `
        <div class="order-card">
            <div class="info-left">
                <h4>物品：${o.goodsName}</h4>
                <p>订单号：${o.id}</p>
                <p>小费：<span class="tip">${o.tip} 元</span></p>
                <p>状态：${status}</p>
            </div>
            <div class="btn-group">
                <button class="btn-detail" onclick="showOrderDetail(${o.id})">查看详情</button>
                <button class="btn-take" id="takeBtn-${o.id}" onclick="takeOrder(${o.id})">立即接单</button>
            </div>
        </div>`;
    });
    if (html === "") html = "<p style='text-align:center;padding:20px;'>暂无待接单</p>";
    document.getElementById("orderList").innerHTML = html;
}

// 接单函数
function takeOrder(orderId) {
    if (!confirm("确定要接此订单吗？")) return;

    const btn = document.getElementById(`takeBtn-${orderId}`);
    if (btn) {
        btn.disabled = true;
        btn.innerText = "接单中...";
    }

    takenOrderIds.add(orderId);

    fetch(baseUrl + "/api/order", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            id: orderId,
            runner_id: user.id,
            state: "已接单"
        })
    })
    .then(res => {
        if (!res.ok) throw new Error("请求失败");
        return res.json();
    })
    .then(res => {
        alert("接单成功！");
        loadAllOrders();
        loadMyTakeOrders();
    })
    .catch(err => {
        alert("接单失败，请重试");
        if (btn) {
            btn.disabled = false;
            btn.innerText = "立即接单";
        }
        takenOrderIds.delete(orderId);
        console.error(err);
    });
}

// 加载我的接单记录
function loadMyTakeOrders() {
    fetch(baseUrl + "/api/order/list?pageNum=1&pageSize=100")
        .then(res => res.json())
        .then(res => {
            let list = res.data?.records || [];
            let myList = list.filter(o => 
                o.runner_id == user.id || takenOrderIds.has(o.id)
            );
            renderMyOrders(myList);
        });
}

// ✅ 关键修改：直接读取后端订单状态来控制按钮
function renderMyOrders(list) {
    let html = "";
    list.forEach(o => {
        // 直接用后端的真实状态
        let orderStatus = o.state || o.status || "未知状态";
        let tipColor = orderStatus === "已完成" ? "#28a745" : "#409eff";
        
        // 根据后端状态决定按钮
        let finishBtn = "";
        if (orderStatus === "已接单") {
            finishBtn = `<button class="btn-finish" id="finishBtn-${o.id}" onclick="finishOrder(${o.id})">确认完成</button>`;
        } else if (orderStatus === "已完成") {
            finishBtn = `<button class="btn-finish" disabled>已完成</button>`;
        } else {
            finishBtn = `<button class="btn-finish" disabled style="background:#ccc;">已完成</button>`;
        }
        
        html += `
        <div class="order-card">
            <div class="info-left">
                <h4>物品：${o.goodsName}</h4>
                <p>订单号：${o.id}</p>
                <p>小费：<span class="tip">${o.tip} 元</span></p>
                <p>状态：<span style="color:${tipColor}">${orderStatus}</span></p>
            </div>
            <div class="btn-group">
                <button class="btn-detail" onclick="showOrderDetail(${o.id})">详情</button>
                ${finishBtn}
            </div>
        </div>`;
    });
    if (html === "") html = "<p style='text-align:center;padding:20px;'>暂无接单记录</p>";
    document.getElementById("myOrderList").innerHTML = html;
}

// 完成订单（请求后强制刷新列表）
function finishOrder(orderId) {
    if (!confirm("确认订单已完成？")) return;

    const btn = document.getElementById(`finishBtn-${orderId}`);
    if (btn) {
        btn.disabled = true;
        btn.innerText = "完成中...";
    }

    fetch(baseUrl + "/api/order", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            id: orderId,
            state: "已完成"
        })
    })
    .then(res => {
        if (!res.ok) throw new Error("请求失败");
        return res.json();
    })
    .then(res => {
        alert("订单已完成！");
        // 强制刷新列表，后端状态会更新，按钮自动变灰
        loadMyTakeOrders();
    })
    .catch(err => {
        alert("完成失败，请重试");
        if (btn) {
            btn.disabled = false;
            btn.innerText = "确认完成";
        }
        console.error(err);
    });
}

// 查看订单详情
function showOrderDetail(orderId) {
    fetch(baseUrl + "/api/order/list?pageNum=1&pageSize=100")
        .then(res => res.json())
        .then(res => {
            let list = res.data?.records || [];
            let order = list.find(o => o.id === orderId);
            if (!order) {
                alert("订单不存在");
                return;
            }
            let modalHtml = `
                <p><strong>订单号：</strong>${order.id}</p>
                <p><strong>物品名称：</strong>${order.goodsName}</p>
                <p><strong>取货地址：</strong>${order.pickupAddress || "无"}</p>
                <p><strong>送货地址：</strong>${order.deliveryAddress || "无"}</p>
                <p><strong>小费：</strong>${order.tip} 元</p>
                <p><strong>状态：</strong>${order.state || order.status || "未知状态"}</p>
            `;
            document.getElementById("modalBody").innerHTML = modalHtml;
            document.getElementById("orderModal").style.display = "flex";
        });
}

// 关闭弹窗
function closeModal() {
    document.getElementById("orderModal").style.display = "none";
}

document.getElementById("orderModal").addEventListener("click", function(e) {
    if (e.target === this) closeModal();
});
</script>
</body>
</html>
