<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>校园快递跑腿系统-个人中心</title>
    <link rel="stylesheet" href="./style.css">
    <style>
        /* 个人中心卡片样式 */
        .profile-card {
            max-width: 400px;
            margin: 80px auto;
            background: white;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .profile-card h2 {
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }

        .profile-item {
            display: flex;
            justify-content: center;
            margin: 15px 0;
            font-size: 16px;
        }

        .profile-label {
            color: #666;
            margin-right: 10px;
        }

        .profile-value {
            color: #333;
            font-weight: 500;
        }

        .profile-btn {
            width: 160px;
            height: 45px;
            line-height: 45px;
            background-color: #409eff;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 6px;
            border: none;
            font-size: 16px;
            cursor: pointer;
            margin: 20px auto 0;
            display: block;
            transition: 0.2s;
        }

        .profile-btn:hover {
            background-color: #2b8dff;
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <div class="nav">
        <a href="index.html">首页</a>
        <a href="order.html">订单列表</a>
        <a href="publish.html">发布跑腿</a>
        <a href="mine.html">个人中心</a>
    </div>

    <!-- 个人中心卡片 -->
    <div class="profile-card">
        <h2>个人中心</h2>

        <div class="profile-item">
            <span class="profile-label">用户名：</span>
            <span class="profile-value">校园用户</span>
        </div>
        <div class="profile-item">
            <span class="profile-label">学号：</span>
            <span class="profile-value">2026001001</span>
        </div>
        <div class="profile-item">
            <span class="profile-label">手机号：</span>
            <span class="profile-value">138****5678</span>
        </div>
        <div class="profile-item">
            <span class="profile-label">已发布订单：</span>
            <span class="profile-value">2单</span>
        </div>
        <div class="profile-item">
            <span class="profile-label">已接单：</span>
            <span class="profile-value">1单</span>
        </div>

        <button class="profile-btn">我的订单</button>
        <button class="profile-btn" style="background-color: #f56c6c;">退出登录</button>
    </div>

    <!-- 页脚 -->
    <div class="footer">© 2026 校园快递跑腿管理系统</div>
</body>
</html>
