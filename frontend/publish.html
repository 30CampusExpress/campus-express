<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>发布跑腿订单</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="nav">
        <a href="index.html">首页</a>
        <a href="order.html">订单列表</a>
        <a href="publish.html">发布订单</a>
        <a href="mine.html">个人中心</a>
    </div>
    <div class="container" style="width:500px;">
        <h2 class="title">发布快递跑腿订单</h2>
        <div class="form-item">
            <label>取件地址：</label>
            <input type="text" placeholder="如：东门快递站">
        </div>
        <div class="form-item">
            <label>送达地址：</label>
            <input type="text" placeholder="如：12栋宿舍楼">
        </div>
        <div class="form-item">
            <label>快递类型：</label>
            <select>
                <option>快递代取</option>
                <option>快递代寄</option>
                <option>校园跑腿</option>
            </select>
        </div>
        <div class="form-item">
            <label>悬赏金额：</label>
            <input type="text" placeholder="输入金额">
        </div>
        <div class="form-item">
            <label>备注说明：</label>
            <textarea placeholder="输入物品信息、要求"></textarea>
        </div>
        <div class="form-item" style="margin-left:102px;">
            <button class="btn">提交发布</button>
        </div>
    </div>
</body>
</html>
