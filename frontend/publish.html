<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>发布跑腿订单</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:"微软雅黑";background:#f5f7fa}
        .nav{background:#409eff;padding:15px 30px}
        .nav a{color:#fff;text-decoration:none;margin-right:20px}
        .publish-box{width:500px;margin:50px auto;background:#fff;padding:30px;border-radius:8px;box-shadow:0 0 10px #eee}
        .publish-box h2{text-align:center;margin-bottom:20px}
        .form-item{margin-bottom:15px}
        .form-item label{display:block;margin-bottom:5px}

        .form-item input,
        .form-item textarea{
            width:100%;
            height:42px;
            padding:10px;
            border:1px solid #ddd;
            border-radius:4px;
            font-size:14px;
            font-family:"微软雅黑";
        }

        input::placeholder,
        textarea::placeholder{
            font-size:14px;
            color:#999;
            font-family:"微软雅黑";
        }

        .publish-btn{
            width:100%;
            padding:12px;
            background:#409eff;
            color:#fff;
            border:none;
            border-radius:4px;
            font-size:16px;
            cursor:pointer
        }
        .publish-btn:disabled{
            background:#a0cfff;
            cursor:not-allowed
        }

        .user-info{
            color:white;
            margin-left:10px;
            display:none;
        }
        .user-info button{
            margin-left:8px;
            padding:2px 6px;
            cursor:pointer;
        }
    </style>
</head>
<body>

<div class="nav">
    <a href="index.html">首页</a>
    <a href="publish.html">发布跑腿</a>
    <a href="login.html" id="loginBtn">登录</a>
    <span class="user-info" id="userInfo">
        欢迎，<span id="uname"></span>
        <button onclick="logout()">退出</button>
    </span>
</div>

<div class="publish-box">
    <h2>发布跑腿订单</h2>
    <form id="publishForm">

        <div class="form-item">
            <label>取货地址</label>
            <input type="text" id="pickupAddress" placeholder="请输入取货地址（如：一号宿舍楼）">
        </div>

        <div class="form-item">
            <label>送货地址</label>
            <input type="text" id="deliveryAddress" placeholder="请输入送货地址（如：学校大门口）">
        </div>

        <div class="form-item">
            <label>物品名称</label>
            <input type="text" id="goodsName" placeholder="例如：快递、外卖、文件">
        </div>

        <div class="form-item">
            <label>物品描述</label>
            <textarea id="description" placeholder="详细说明取件/送件要求"></textarea>
        </div>

        <div class="form-item">
            <label>物品类型</label>
            <input type="text" id="goodsType" placeholder="例如：文件、快递、餐饮">
        </div>

        <div class="form-item">
            <label>小费(元)</label>
            <input type="text" id="tip" placeholder="请输入数字（如 5.0）">
        </div>

        <button type="submit" class="publish-btn" id="publishBtn">发布订单</button>
    </form>
</div>

<script>
const baseUrl = "http://172.25.168.86:9090";

window.onload = function(){
    let userInfo = localStorage.getItem("userInfo");
    if(!userInfo){
        alert("请先登录！");
        window.location.href = "login.html";
        return;
    }

    let loginBtn = document.getElementById("loginBtn");
    let userInfoBar = document.getElementById("userInfo");
    let uname = document.getElementById("uname");
    let isLogin = localStorage.getItem("isLogin");
    let username = localStorage.getItem("username");

    if(isLogin === "true"){
        loginBtn.style.display = "none";
        userInfoBar.style.display = "inline-block";
        uname.innerText = username;
    }else{
        loginBtn.style.display = "inline-block";
        userInfoBar.style.display = "none";
    }
}

function validNumber(fieldId, fieldName){
    let input = document.getElementById(fieldId);
    input.addEventListener("blur",function(){
        let val = this.value.trim();
        if(val === "") return;
        let reg = /^(0|[1-9]\d*)(\.\d+)?$/;
        if(!reg.test(val)){
            alert(fieldName + "必须是正数，支持小数！");
            this.value = "";
            this.focus();
        }
    });
}

validNumber("tip", "小费");

document.getElementById("publishForm").addEventListener("submit", function(e){
    e.preventDefault();

    let userInfo = JSON.parse(localStorage.getItem("userInfo"));
    let senderId = userInfo.id;

    let pickupAddress = document.getElementById("pickupAddress").value.trim();
    let deliveryAddress = document.getElementById("deliveryAddress").value.trim();
    
    let goodsName = document.getElementById("goodsName").value.trim();
    let description = document.getElementById("description").value.trim();
    let goodsType = document.getElementById("goodsType").value.trim();
    let tip = document.getElementById("tip").value.trim();

    if(!pickupAddress || !deliveryAddress || !goodsName || !description || !goodsType || !tip){
        alert("请填写完整订单信息！所有字段不能为空");
        return;
    }

    let btn = document.getElementById("publishBtn");
    btn.disabled = true;
    btn.innerText = "发布中...";

    fetch(baseUrl + "/api/order", {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body:JSON.stringify({
            pickupAddress: pickupAddress,
            deliveryAddress: deliveryAddress,
            goodsName:goodsName,
            description:description,
            goodsType:goodsType,
            tip:parseFloat(tip),
            senderId:senderId,
            status:"已发布"
        })
    })
    .then(res=>res.json())
    .then(res=>{
        if(res.code===200){
            alert("发布成功！");
            window.location.href = "index.html";
        }else{
            alert("发布失败："+(res.message||"未知错误"));
        }
    })
    .catch(err=>{
        alert("连接后端失败：" + err);
    })
    .finally(()=>{
        btn.disabled = false;
        btn.innerText = "发布订单";
    });
});

function logout(){
    localStorage.clear();
    alert("退出成功");
    location.href = "login.html";
}
</script>
</body>
</html>
