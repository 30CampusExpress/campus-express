<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>校园快递跑腿系统-登录</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <!-- 导航栏 -->
    <div class="nav">
        <a href="index.html">首页</a>
        <a href="login.html">登录</a>
        <a href="register.html">注册</a>
        <a href="order.html">全部订单</a>
    </div>

    <!-- 登录卡片 -->
    <div class="login-card">
        <h2>用户登录</h2>
        <form class="login-form">
            <div class="form-item">
                <label>账号：</label>
                <input type="text" placeholder="请输入学号/账号">
            </div>
            <div class="form-item">
                <label>密码：</label>
                <input type="password" placeholder="请输入密码">
            </div>
            <button type="submit" class="login-btn">登录</button>
        </form>
        <p class="register-tip">没有账号？<a href="register.html">去注册</a></p>
    </div>

    <!-- 页脚 -->
    <div class="footer">© 2026 校园快递跑腿管理系统</div>
</body>
</html>
